services:
  - type: web
    name: bloodbank-api
    runtime: java
    plan: free
    rootDir: bloodbank
    buildCommand: mvn -B clean package -DskipTests
    startCommand: java -jar target/bloodbank-1.0.0.jar
    healthCheckPath: /api/drives
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_RESET_WORD
        value: happy
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:8080,https://bloodbank-pme5.vercel.app
