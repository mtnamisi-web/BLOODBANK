server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bloodbank}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-of-at-least-32-chars}
app.jwt.hours=12
app.password-reset.word=${PASSWORD_RESET_WORD:happy}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
